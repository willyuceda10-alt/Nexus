server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness probe for Container Apps — no auth, no logging overhead.
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Runtime config is regenerated at container start. Never cache it.
    location = /runtime-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Vite-built assets carry a content hash in the filename. Cache indefinitely.
    location ~* \.(js|css|woff|woff2|svg|ico|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # All navigation routes fall through to index.html (SPA client routing).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
}
