server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Generated by docker-entrypoint-web.sh so the CSP can name the runtime API origin.
    # nginx discards inherited add_header directives in any block that declares its own,
    # so this is re-included in each location below rather than only at server level.
    include /etc/nginx/conf.d/security-headers.conf;

    # Liveness probe for Container Apps — no auth, no logging overhead.
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Runtime config is regenerated at container start. Never cache it.
    # No `expires` here: it emits a second, weaker Cache-Control that an intermediary
    # could honour, and a stale runtime-config silently breaks the whole SPA.
    location = /runtime-config.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Vite-built assets carry a content hash in the filename. Cache indefinitely.
    location ~* \.(js|css|woff|woff2|svg|ico|png|jpg|jpeg|webp)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # All navigation routes fall through to index.html (SPA client routing).
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
}
