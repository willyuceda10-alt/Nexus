name: Bridata Project CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexus_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nexus_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://nexus_runtime:nexus@localhost:5432/nexus_ci
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_ci
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Verify Prisma can generate baseline SQL
        run: npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/bridata-project-baseline.sql

      - name: Apply migrations to PostgreSQL 16
        env:
          DATABASE_URL: ${{ env.ADMIN_DATABASE_URL }}
        run: npm run prisma:migrate:deploy

      - name: Provision idempotent non-bypass runtime database role
        env:
          RUNTIME_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          npx tsx prisma/provision-runtime-role.ts
          npx tsx prisma/provision-runtime-role.ts

      - name: Seed DEV fixture through FORCE RLS
        env:
          NODE_ENV: test
        run: npm run prisma:seed:dev

      - name: Verify tenant RLS isolation
        run: npx tsx prisma/rls-smoke.ts

      - name: Verify pre-tenant session discovery
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/session-smoke.ts

      - name: Verify API bootstrap through auth and RLS
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/bootstrap-smoke.ts

      - name: Verify object CRUD and optimistic locking
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/objects-crud-smoke.ts

      - name: Verify persistent object collaboration and audit
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/collaboration-v1-smoke.ts

      - name: Verify per-field object history and governed persistent relations
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/object-history-relations-v1-smoke.ts

      - name: Verify persistent document version metadata
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/document-metadata-v1-smoke.ts

      - name: Verify governed document binary upload and download authorization
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/document-binary-v1-smoke.ts

      - name: Verify persistent object approval lifecycle
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/object-approvals-v1-smoke.ts

      - name: Verify persistent portfolio hierarchy
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/portfolio-hierarchy-smoke.ts

      - name: Verify hierarchy integrity and management roles
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/hierarchy-hardening-smoke.ts

      - name: Verify resource capacity planning
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/resource-capacity-smoke.ts

      - name: Verify resource planning edits and recalculation
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/resource-capacity-edit-smoke.ts

      - name: Verify dependency graph and cycle protection
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/dependencies-smoke.ts

      - name: Verify CPM schedule analysis
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/schedule-analysis-smoke.ts

      - name: Verify working calendar scheduling
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/working-calendar-smoke.ts

      - name: Verify project forecast
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/forecast-smoke.ts

      - name: Verify project baseline capture
        env:
          AUTH_MODE: dev
          DEV_AUTH_ENABLED: "true"
          DEV_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_TENANT_ID: 00000000-0000-4000-8000-000000000002
        run: npx tsx apps/api/test/baseline-smoke.ts

      - name: Validate Azure Bicep and DEV parameters
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file infra/azure/api-runtime.bicep --stdout > /dev/null
          az bicep build --file infra/azure/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/azure/dev.bicepparam --stdout > /dev/null

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build production API image
        run: docker build --file Dockerfile.api --target runtime --tag bridata-api:ci .

      - name: Verify production image excludes migration tooling
        run: |
          docker run --rm --entrypoint node bridata-api:ci --version
          docker run --rm --entrypoint sh bridata-api:ci -c 'test ! -e ./node_modules/.bin/prisma && test ! -e ./node_modules/.bin/tsx'

      - name: Build migration job image
        run: docker build --file Dockerfile.api --target migrate --tag bridata-migrate:ci .

      - name: Verify migration image contains required tooling
        run: |
          docker run --rm --entrypoint sh bridata-migrate:ci -c 'test -x ./node_modules/.bin/prisma && test -x ./node_modules/.bin/tsx && test -f prisma/provision-runtime-role.ts'