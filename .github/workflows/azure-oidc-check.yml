name: Azure OIDC Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/azure-oidc-check.yml'

permissions:
  id-token: write
  contents: read

jobs:
  verify-azure-oidc:
    name: Verify GitHub to Azure trust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required repository variables
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_LOCATION; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing repository variable::${name} is not configured in GitHub Actions variables."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure subscription
        run: az account show --query '{name:name,id:id,tenantId:tenantId,state:state}' --output table

      - name: Verify DEV resource group
        shell: bash
        run: |
          set -euo pipefail
          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --query '{name:name,location:location,provisioningState:properties.provisioningState}' \
            --output table

      - name: Verify expected region
        shell: bash
        run: |
          set -euo pipefail
          actual="$(az group show --name "$AZURE_RESOURCE_GROUP" --query location -o tsv)"
          expected="$(printf '%s' "$AZURE_LOCATION" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
          normalized_actual="$(printf '%s' "$actual" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
          if [ "$normalized_actual" != "$expected" ]; then
            echo "::error title=Azure location mismatch::Resource group is in '$actual' but AZURE_LOCATION expects '$AZURE_LOCATION'."
            exit 1
          fi
