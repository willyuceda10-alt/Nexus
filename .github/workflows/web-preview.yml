name: Bridata Project Web Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/web-preview.yml'

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-nexus-dev' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'brazilsouth' }}
  STATIC_WEB_APP_NAME: bridata-project-dev

jobs:
  preview:
    name: Build and publish DEV preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Azure identifiers
        shell: bash
        run: |
          test -n "$AZURE_CLIENT_ID" || (echo "AZURE_CLIENT_ID is not configured" && exit 1)
          test -n "$AZURE_TENANT_ID" || (echo "AZURE_TENANT_ID is not configured" && exit 1)
          test -n "$AZURE_SUBSCRIPTION_ID" || (echo "AZURE_SUBSCRIPTION_ID is not configured" && exit 1)

      - name: Install locked dependencies
        run: npm ci

      - name: Build visual preview
        env:
          VITE_DATA_MODE: mock
        run: npm run build:web

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Free Static Web App exists
        shell: bash
        run: |
          if ! az staticwebapp show --name "$STATIC_WEB_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az staticwebapp create \
              --name "$STATIC_WEB_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --sku Free \
              --tags product="Bridata Project" environment=dev managedBy=GitHubActions \
              --output none
          fi

      - name: Read ephemeral deployment token
        id: swa
        shell: bash
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.apiKey \
            --output tsv)
          test -n "$TOKEN" || (echo "Static Web Apps deployment token was empty" && exit 1)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy prebuilt web
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: dist
          skip_app_build: true

      - name: Publish preview URL
        shell: bash
        run: |
          HOSTNAME=$(az staticwebapp show \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query defaultHostname \
            --output tsv)
          echo "### Bridata Project DEV Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$HOSTNAME" >> "$GITHUB_STEP_SUMMARY"
