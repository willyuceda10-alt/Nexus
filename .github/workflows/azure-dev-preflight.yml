name: Azure DEV Preflight

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: bridata-azure-dev-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate Azure DEV without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required repository variables
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_LOCATION; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing repository variable::${name} is not configured in GitHub Actions variables."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target scope
        shell: bash
        run: |
          set -euo pipefail
          az group show --name "$AZURE_RESOURCE_GROUP" --output none
          echo "Target resource group exists and is accessible."

      - name: Validate Bicep compilation
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null

      - name: Run Azure what-if
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --name bridata-dev-preflight \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters namePrefix=nexus environment=dev \
            --no-pretty-print

      - name: Confirm no deployment was executed
        run: |
          echo "Preflight completed. This workflow performs validation/what-if only and does not run 'az deployment group create'."
